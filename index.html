<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ググレカス風サイト</title>
    <style>
        body { text-align: center; font-family: sans-serif; padding-top: 100px; }
        .search-box { font-size: 24px; padding: 10px; width: 400px; text-align: center; }
        .message { font-size: 18px; color: red; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <h1>自分で調べよう！</h1>
    <!-- 検索文字が自動入力されるダミーの検索窓 -->
    <input type="text" id="search" class="search-box" readonly>
    <div id="message" class="message"></div>

    <script>
        // 1. URLのパラメータ（?q=xxx）から検索ワードを取得
        const urlParams = new URLSearchParams(window.location.search);
        const query = urlParams.get('q') || '自分で調べる方法'; // パラメータがない時のデフォルト

        const searchInput = document.getElementById('search');
        const messageDiv = document.getElementById('message');
        
        let index = 0;

        // 2. 1文字ずつタイピングするアニメーション
        function typeKeyword() {
            if (index < query.length) {
                searchInput.value += query.charAt(index);
                index++;
                setTimeout(typeKeyword, 200); // 0.2秒ごとに次の文字を入力
            } else {
                // 入力が終わったらメッセージを表示
                messageDiv.innerText = "これくらい自分で調べろカス！今からGoogleを開きます...";
                
                // 3. 2秒後にGoogleの検索結果へリダイレクト
                setTimeout(() => {
                    window.location.href = "https://google.com" + encodeURIComponent(query);
                }, 2000);
            }
        }

        // ページが読み込まれたらタイピングを開始
        window.onload = () => {
            setTimeout(typeKeyword, 1000); // 1秒後にスタート
        };
    </script>
</body>
</html>
